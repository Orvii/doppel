# Doppel CI — iki iş: Windows'ta tam takım, Linux'ta X11 + erişilebilirlik + saf mantık.
#
# Bu dosya bir doğrulama İDDİASI değil; hangi yolun nerede koştuğunun
# haritası. Linux işinin yeşile döndüğü ancak ilk koşuda görülür.
#
# ## Linux'ta NE koşuyor
#
# - Bütün saf mantık takımı (dosya, ofis, ajan döngüsü, güvenlik vb.).
# - Qt, `offscreen` platform eklentisiyle. Yani Qt'nin X11 (xcb) yolu
#   değil, offscreen yolu koşuyor: pencere yöneticisi gerektiren hiçbir
#   şey yok. Qt6 xcb kütüphaneleri yine de kurulu (eksik olduklarında Qt
#   tam sayfa hata verip hiç açılmıyor).
# - DISPLAY'e bakan X11 kod yolları: Xvfb sunucusu (1920x1080x24) açık.
#   (Yeni pip paketi YOK: port sistem araçlarıyla konuşuyor — girdi
#   xdotool/XTEST, monitör sorgusu `xrandr` (x11-utils), kayıt ffmpeg.)
# - Erişilebilirlik (AT-SPI): python3-pyatspi + at-spi2-core kurulu,
#   pytest `dbus-run-session` içinde koşuyor. Gerekçe: pyatspi pip'ten
#   kurulamıyor, sistem dist-packages'te duruyor; sanal ortam bu yüzden
#   `--system-site-packages` ile sistem python3'ünden kuruluyor. Veri
#   yolu yoksa port modülleri "erişilebilirlik kullanılamaz" dalına
#   düşüyor ve takım yine yeşil kalır — kurulum o dalı değil, gerçek
#   yolu denetlenebilir kılmak için var.
#
# ## Linux'ta NE koşmuyor (dürüst boşluklar)
#
# - Pencere yöneticisi (WM) yok: odak, yığın sırası ve EWMH davranışları
#   test EDİLMİYOR. Bu bilinçli — WM eklemek yakalanması gereken farkı
#   gizlerdi; pencere yönetimi testleri sahte araçlarla koşuyor.
# - GPU yok: Qt yazılım çiziyor.
# - Kullanıcının masaüstündeki yazı tipleri yok: Qt yazı ölçülerine bakan
#   yerleşim testleri burada başka ölçülerle koşar.
# - Wayland/portal yolları: koşan bir kompozitör yok, yalnızca sahte
#   nesneli birim testleri. GERÇEK bir Wayland masaüstünde denenene kadar
#   DOĞRULANMAMIŞ sayılır. `xdg-desktop-portal` BİLEREK kurulmadı: portal
#   akışları sahte taşıyıcıyla koşuyor, gerçek portalı kurmak hiçbir şeyi
#   denetlemeden işi yavaşlatırdı. Yalnızca girdi (RemoteDesktop portalı)
#   uygulandı; Wayland'de ekran yakalama bu sürümde YOK — çağrı belgelenmiş
#   bir "uygulanmadı" hatası veriyor, sessizce yanlış kare döndürmüyor.
#   `dbus-next` requirements-linux.txt'te ama TEMBEL import ediliyor
#   (portal taşıyıcısının __init__'i), test toplama anında sys.modules'a
#   girmiyor.
# - Gerçek masaüstündeki diğer uygulamaların pencerelerini yakalama yolu
#   (Windows'taki PrintWindow eşdeğeri) yok; onun yerine yan ekran var.
# - `xdotool`/`ydotool` ile gerçek girdi ENJEKSİYONU masaüstüne dokunmaz:
#   port testleri araçları sahteliyor (argv sözleşmesi). xdotool kuruldu;
#   ydotool bilerek kurulmadı — gerçek uinput yolu CI'da verilmemesi
#   gereken udev ayrıcalıkları istiyor, o yüzden sahte subprocess'
#   ötesine geçmez.
# - Esc kill switch'inin Linux okuyucusu python-xlib'i VARSA kullanıyor
#   (isteğe bağlı import). Kurulu değilse Esc en iyi çaba olarak kapalı;
#   Dur düğmesi ve SIGINT/SIGTERM yolları koşar. Xlib okuma yolu
#   (XQueryKeymap) BİLEREK DOĞRULANMAMIŞ: Xvfb'de okunacak gerçek bir tuş
#   durumu yok, kurmak CI'yı kanıt olmadan yeşil gösterirdi. Gerçek bir
#   X11 masaüstünde biri koşturana kadar öyle kalıyor.
# - BİLİNEN AÇIK (2026-10-07): `app/single.py`, `app/kisayol.py`,
#   `app/baslangic.py`, `app/fluent.py` modül düzeyinde winreg/ctypes.windll
#   kullanıyor ve henüz Linux'ta korunmadı. app/single.py'yi
#   tests/test_computer.py modül düzeyinde içe aldığı için o dosyanın
#   Linux'ta toplanması, app/ iş kolu korumayı yapana kadar düşebilir.
#   Bu atanmış bir açık; iş akışı onu gizlemiyor, kırmızı gösteriyor.
#
# ## Windows'ta NE koşuyor
#
# - Tam takım, mevcut davranış. Win32 yolları gerçek API'lerle koşuyor
#   (uiautomation, ConPTY, kayıt defteri).

name: CI

on:
  push:
    branches: [master, "port/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows — tam takım
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-windows.txt

      - name: Bağımlılıklar (ortak + Windows)
        run: python -m pip install -r requirements.txt -r requirements-windows.txt

      # NOT: tek örnek (mutex) testleri zamanlamaya duyarlı; yüklü bir
      # makinede tek seferlik düşebiliyor. Ölçüldü (2026-10-07): tam
      # takımda 834 geçti / 2 düştü (test_computer.py::TestTekOrnek),
      # tekrarında ikisi de geçti. Kırmızı bu testlerse önce tek başına
      # koştur: python -m pytest tests/test_computer.py::TestTekOrnek -q
      - name: Testler
        run: python -m pytest -q

  linux:
    name: Linux — Xvfb + dbus + offscreen Qt
    # Sürüm sabit: sistem python3'ü 3.12 ve apt paketleri
    # (/usr/lib/python3/dist-packages) bu sürüme ait. `ubuntu-latest`
    # kayarsa pyatspi ile yorumlayıcı eşleşmez.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Qt offscreen: pencere yöneticisi olmayan makinede xcb eklentisi
      # düşerdi. X11 kod yolları Qt'den değil, DISPLAY üzerinden koşuyor
      # (Xvfb sunucusu aşağıda açılıyor).
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Sır taraması (kanca ile aynı kalıplar)
        shell: bash
        # Kalıplar scripts/secret-patterns.sh'te — tek kaynak. Kanca
        # sahnelenen farkı, CI tüm izlenen ağacı tarar; kapsam bilinçli
        # olarak farklı, kalıp listesi ortak.
        run: |
          . scripts/secret-patterns.sh
          sir_tara_repo

      - name: Sistem paketleri
        # xvfb: yan masaüstü ve X11 test sunucusu (olmadan yan masa
        # tamamen ölü). ffmpeg: yan masanın kaydı (x11grab). xdotool,
        # x11-utils, wmctrl: X11 girdi ve pencere araçları. dbus +
        # dbus-x11: dbus-run-session ve oturum veri yolu.
        # at-spi2-core + python3-pyatspi: erişilebilirlik (pyatspi
        # pip'ten kurulamıyor, dist-packages'ten geliyor).
        # python3-venv: sanal ortam. Qt6 xcb kütüphaneleri: eksikse Qt
        # açılmıyor; bugün offscreen koşuyoruz ama kurulu dursunlar.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xdotool x11-utils wmctrl ffmpeg \
            dbus dbus-x11 at-spi2-core python3-pyatspi python3-venv \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xkb1 libxcb-xinerama0 libdbus-1-3 libegl1

      - name: Sanal ortam (sistem paketlerini gören)
        # setup-python değil sistem python3'ü: pyatspi bir dist-package ve
        # yalnızca /usr/lib/python3/dist-packages'te. venv o dizini
        # --system-site-packages ile görüyor; pip paketleri venv'e kurulup
        # öncelik kazanıyor.
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install -r requirements.txt -r requirements-linux.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Duman testi (Qt + X11 + erişilebilirlik)
        # Kırılmayı ayırt edilebilir kılar: burada düşerse sorun testlerde
        # değil, platform eklentisinde, Xvfb'de ya da pyatspi kurulumunda.
        # pyatspi importu KASITLI olarak sert hata: kurulumun tek amacı o
        # modülü görünür kılmak; görünmezse port sessizce "erişilebilirlik
        # yok" dalına düşer ve CI bir şey denetliyor gibi yapmış olur.
        # Veri yoluyla sarmalandı çünkü testler de öyle koşuyor; aynı
        # ortamı denemek, "burada geçti orada düştü" sürprizini eler.
        run: |
          python -c "from PySide6.QtWidgets import QApplication; a = QApplication([]); print('Qt platform:', a.platformName())"
          xvfb-run -a --server-args="-screen 0 1920x1080x24" sh -c 'xdpyinfo >/dev/null && echo "X11 OK"'
          dbus-run-session -- python -c "import pyatspi; print('pyatspi OK')"

      - name: Testler (Xvfb + dbus oturumu)
        # dbus-run-session: erişilebilirlik veri yolu. Xvfb dışta, dbus
        # içte — DISPLAY ikisine de miras kalıyor.
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" dbus-run-session -- python -m pytest -q